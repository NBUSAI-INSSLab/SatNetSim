<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- SatNetSim logo：薄荷绿渐变圆角方块 + 轨道弧 + 星座节点 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#149BA5"/>
      <stop offset="1" stop-color="#0B5E66"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- 底板：圆角方块 -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg)"/>

  <!-- 大轨道弧（倾斜椭圆的一段，象征卫星轨道） -->
  <ellipse cx="64" cy="66" rx="44" ry="18" fill="none"
           stroke="url(#orbit)" stroke-width="4"
           transform="rotate(-24 64 66)" stroke-linecap="round"
           stroke-dasharray="200 80"/>

  <!-- 星座节点（卫星）与星间链路（ISL 网状） -->
  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2">
    <line x1="30" y1="88" x2="64" y2="42"/>
    <line x1="64" y1="42" x2="98" y2="88"/>
    <line x1="30" y1="88" x2="98" y2="88"/>
    <line x1="64" y1="42" x2="64" y2="24"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="64" cy="42" r="7"/>
    <circle cx="30" cy="88" r="5.5"/>
    <circle cx="98" cy="88" r="5.5"/>
    <circle cx="64" cy="24" r="4.5"/>
  </g>
  <!-- 中心节点高亮环 -->
  <circle cx="64" cy="42" r="10.5" fill="none" stroke="#BFF2EC"
          stroke-opacity="0.8" stroke-width="2"/>
</svg>
